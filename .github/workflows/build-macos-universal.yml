name: "Build macOS universal DMG (Intel + ARM64)"

# Phase 2 of the universal-binary plan (Phase 1 PoC: poc-depends-x86_64.yml).
# Builds nusacoin-qt for Intel (x86_64) against the depends prefix proven by
# the PoC, builds it again natively for ARM64 (Homebrew, as in build-macos.yml),
# merges the two binaries with lipo, and packages a universal DMG.
#
# BDB version split (for the release notes): the Intel slice links depends'
# Berkeley DB 4.8; the ARM64 slice links Homebrew berkeley-db@5 (5.3).
# Wallet files are not interchangeable between the two without care —
# same caveat as the standalone ARM64 DMG.
#
# CI-side shims only; repo sources stay untouched:
#  - Intel app build reuses the PoC depends cache (key depends-x86_64-*).
#  - The working-tree sed patches from build-macos.yml are applied before
#    both app builds (2020-era sources vs 2026 clang).
#  - The universal binary is stripped before `make deploy` (cf. PR #14);
#    stripping must happen before any code-signing step.

on:
  workflow_dispatch: # manual only; macOS minutes are precious (10x multiplier)
  pull_request: # TEMPORARY for development; remove before merge

jobs:
  build-universal:
    name: Build universal DMG (x86_64 + arm64)
    runs-on: macos-latest
    timeout-minutes: 360 # GitHub-hosted max; two app builds need it
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions (debug)
        run: |
          xcrun clang --version | head -2
          ./depends/config.guess

      - name: Install Rosetta 2 (runs x86_64 test binaries)
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/uname -m

      - name: Install setuptools for the build python
        run: |
          # native_biplist's 2020-era setup.py does `import setuptools`.
          python3 -m pip install --break-system-packages setuptools

      - name: Install autotools for depends
        run: |
          # libevent (and others) run autogen.sh during depends preprocessing.
          brew install autoconf automake libtool pkg-config

      - name: Install dependencies (ARM64/Homebrew build)
        run: |
          brew install automake berkeley-db@5 boost ccache libevent librsvg \
            libtool miniupnpc pkg-config python qrencode qt@5 zeromq

      - name: Set up build environment
        run: |
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          {
            echo "BDB_PREFIX=$(brew --prefix berkeley-db@5)"
            echo "BOOST_ROOT=$(brew --prefix boost)"
            echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          } >> "$GITHUB_ENV"
          # Boost >= 1.89 no longer ships a libboost_system binary; drop an
          # empty static archive so the configure probe and link succeed.
          echo "int boost_system_stub;" | c++ -x c++ -c -o /tmp/boost_system_stub.o -
          ar rcs "$(brew --prefix boost)/lib/libboost_system.a" /tmp/boost_system_stub.o
          ccache --max-size=2G
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-macos-universal-${{ github.ref_name }}
          restore-keys: |
            ccache-macos-universal-
            ccache-macos-

      - name: Restore depends cache (x86_64, built by the PoC)
        uses: actions/cache@v4
        with:
          # Same key as poc-depends-x86_64.yml, so this job reuses the
          # proven Intel depends tree instead of rebuilding Qt from source.
          path: |
            depends/built
            depends/sources
          key: depends-x86_64-${{ hashFiles('depends/packages/**', 'depends/hosts/**', 'depends/builders/**', 'depends/patches/**', 'depends/funcs.mk', 'depends/Makefile', 'depends/config.guess', 'depends/config.sub') }}
          restore-keys: |
            depends-x86_64-

      - name: Build depends for x86_64 (if cache missed)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          SDK_PATH="$(xcrun --show-sdk-path)"
          CC_WRAPPER="$(xcrun -f clang) -target x86_64-apple-darwin -mmacosx-version-min=11.0 --sysroot ${SDK_PATH}"
          CXX_WRAPPER="$(xcrun -f clang++) -target x86_64-apple-darwin -mmacosx-version-min=11.0 --sysroot ${SDK_PATH} -stdlib=libc++"
          make -C depends -j"$(sysctl -n hw.ncpu)" \
            HOST=x86_64-apple-darwin \
            OSX_MIN_VERSION=11.0 \
            "darwin_CC=${CC_WRAPPER}" \
            "darwin_CXX=${CXX_WRAPPER}"
          test -f "$PWD/depends/x86_64-apple-darwin/share/config.site"

      - name: Apply macOS toolchain compatibility patches
        run: |
          # Older Nusacoin sources use declaration style that modern Clang
          # rejects as a hard error ("'short type-name' is invalid"). Patch
          # the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/uint16_t short randv/uint16_t randv/' src/addrdb.cpp
          # Homebrew ships miniupnpc 2.2, whose UPNP_GetValidIGD takes 7
          # arguments (the old 5-argument call no longer compiles). Patch the
          # working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/UPNP_GetValidIGD(devlist, &urls, &data, lanaddr, sizeof(lanaddr));/UPNP_GetValidIGD(devlist, \&urls, \&data, lanaddr, sizeof(lanaddr), nullptr, 0);/' src/net.cpp
          # Boost >= 1.89 removed the old Filesystem v2 enum
          # fs::copy_option::overwrite_if_exists (singular). Use the v3 enum
          # class name instead: copy_options::overwrite_existing.
          # Patch the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/fs::copy_option::overwrite_if_exists/fs::copy_options::overwrite_existing/' src/wallet/bdb.cpp
          # Boost >= 1.80 removed the deprecated Filesystem v2 method
          # recursive_directory_iterator::level() (deprecated since 1.72);
          # use depth(), which has been the documented name since 1.72.
          # Patch the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/it.level()/it.depth()/' src/wallet/walletutil.cpp
          # Makefile.am still references contrib/macdeploy/fancy.plist as a
          # dmg prerequisite, but the file is missing from the repo (it
          # exists upstream; this fork lost it). Generate a minimal plist in
          # the working tree only; repo sources stay untouched.
          cat > contrib/macdeploy/fancy.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>window_bounds</key>
          	<array>
          		<integer>100</integer>
          		<integer>100</integer>
          		<integer>540</integer>
          		<integer>380</integer>
          	</array>
          	<key>icon_size</key>
          	<integer>128</integer>
          	<key>applications_symlink</key>
          	<true/>
          	<key>items_position</key>
          	<dict>
          		<key>Nusacoin-Qt.app</key>
          		<array>
          			<integer>120</integer>
          			<integer>150</integer>
          		</array>
          		<key>Applications</key>
          		<array>
          			<integer>420</integer>
          			<integer>150</integer>
          		</array>
          	</dict>
          </dict>
          </plist>
          PLIST
          # macdeployqtplus calls plistlib.readPlist, removed in Python 3.9
          # (the script runs under python3). Use plistlib.load instead.
          # Patch the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/plistlib.readPlist(p)/plistlib.load(open(p, "rb"))/' contrib/macdeploy/macdeployqtplus

      - name: Build Intel (x86_64) app against depends
        run: |
          ./autogen.sh
          # Cross-compile the app against the PoC-proven depends prefix.
          # config.site wires CC/CXX at -target x86_64-apple-darwin; pin
          # PKG_CONFIG_PATH to the depends prefix so configure cannot pick up
          # the Homebrew (arm64) Qt instead of depends' Qt 5.9.8.
          CONFIG_SITE="$PWD/depends/x86_64-apple-darwin/share/config.site" \
          PKG_CONFIG_PATH="$PWD/depends/x86_64-apple-darwin/lib/pkgconfig:$PWD/depends/x86_64-apple-darwin/share/pkgconfig" \
            ./configure --prefix="$PWD/depends/x86_64-apple-darwin" \
            --disable-tests --disable-bench --disable-gui-tests
          make -j"$(sysctl -n hw.ncpu)"
          mkdir -p /tmp/intel-bin
          cp src/qt/nusacoin-qt /tmp/intel-bin/nusacoin-qt
          cp src/nusacoind /tmp/intel-bin/nusacoind
          file /tmp/intel-bin/nusacoin-qt
          lipo -archs /tmp/intel-bin/nusacoin-qt

      - name: Clean tree for the ARM64 build
        run: |
          make distclean

      - name: Build ARM64 app (Homebrew)
        run: |
          ./autogen.sh
          # Same configure as build-macos.yml (native Apple Silicon build).
          ./configure --with-incompatible-bdb --with-boost="$(brew --prefix boost)" \
            --disable-tests --disable-bench --disable-gui-tests \
            BDB_LIBS="-L${BDB_PREFIX}/lib -ldb_cxx-5.3" \
            BDB_CFLAGS="-I${BDB_PREFIX}/include" \
            CPPFLAGS="-I$(brew --prefix)/include" \
            LDFLAGS="-L$(brew --prefix)/lib" \
            CC="ccache clang" CXX="ccache clang++"
          make -j"$(sysctl -n hw.ncpu)"
          file src/qt/nusacoin-qt
          lipo -archs src/qt/nusacoin-qt

      - name: Lipo Intel + ARM64 into a universal binary
        run: |
          lipo -create /tmp/intel-bin/nusacoin-qt src/qt/nusacoin-qt \
            -output src/qt/nusacoin-qt-universal
          mv src/qt/nusacoin-qt-universal src/qt/nusacoin-qt
          echo "universal archs: $(lipo -archs src/qt/nusacoin-qt)"
          file src/qt/nusacoin-qt
          case "$(lipo -archs src/qt/nusacoin-qt)" in
            *x86_64*arm64*|*arm64*x86_64*) echo "OK: universal binary" ;;
            *) echo "::error::not a universal binary"; exit 1 ;;
          esac

      - name: Strip universal binary
        run: |
          # Release artifact: no debug symbols (cf. PR #14). Strip before
          # `make deploy`; must run before any code-signing step.
          strip src/qt/nusacoin-qt

      - name: Create universal DMG
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Deploy from the ARM64 (Homebrew) tree so macdeployqtplus resolves
          # the Qt frameworks the arm64 slice links against; the x86_64 slice
          # carries its Qt statically from depends and needs no frameworks.
          QT_TR_DIR="$($(brew --prefix qt@5)/bin/qmake -query QT_INSTALL_TRANSLATIONS)"
          test -d "$QT_TR_DIR"
          AVAIL=""
          for lng in ar bg ca cs da de es fa fi fr gd gl he hu id it ja ko lt lv pl pt ru sk sl sv uk zh_CN zh_TW; do
            if [ -f "$QT_TR_DIR/qt_${lng}.qm" ]; then
              AVAIL="${AVAIL:+$AVAIL,}$lng"
            fi
          done
          echo "Qt translations dir: $QT_TR_DIR (available: ${AVAIL:-none})"
          make deploy QT_TRANSLATION_DIR="$QT_TR_DIR" OSX_QT_TRANSLATIONS="$AVAIL"

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Upload universal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusacoin-qt-macos-universal
          path: "*.dmg"
          if-no-files-found: error
