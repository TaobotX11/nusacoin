name: Build check

# Compile-check every pull request so broken code is caught before merge,
# not after release. (No push trigger: the pull_request build already
# builds the merge result.)
on:
  # No push trigger: the pull_request build already builds the merge
  # result, so a post-merge build would rebuild the same tree.
  pull_request:
    types: [opened, synchronize, reopened]
    # Skip the build for changes that cannot affect compilation
    # (docs, helper scripts, markdown, PoC-only workflow files).
    # A PR touching both code and these paths still triggers the build.
    paths-ignore:
      - 'doc/**'
      - 'contrib/**'
      - '**.md'
      - '.github/workflows/poc-depends-x86_64.yml'

jobs:
  build-ubuntu:
    name: Build on Ubuntu (Qt GUI)
    # Pinned to 24.04: ubuntu-latest moved to 26.04 (Resolute) in Nov 2026
    # and its archive no longer ships libdb5.3++-dev, so configure fails
    # with "libdb_cxx headers missing". Revisit when the BDB dependency
    # situation on newer Ubuntu is resolved.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 ccache \
            libssl-dev libevent-dev libboost-system-dev libboost-filesystem-dev \
            libboost-chrono-dev libboost-test-dev libboost-thread-dev \
            libdb-dev libdb++-dev libminiupnpc-dev libzmq3-dev \
            libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools \
            libqrencode-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-build
          restore-keys: |
            ccache-${{ runner.os }}-build

      - name: Configure
        run: |
          ccache --max-size=2G
          ccache --zero-stats
          ./autogen.sh
          ./configure --with-incompatible-bdb --disable-tests --disable-bench --disable-gui-tests CC="ccache gcc" CXX="ccache g++"

      - name: Build
        run: make -j$(nproc)

      - name: Show ccache stats
        run: ccache --show-stats
