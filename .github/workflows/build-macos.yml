name: Build macOS DMG (Qt)

# Builds Nusacoin-Qt for macOS and uploads the .dmg as a workflow artifact.
# Run it on demand from the repository's "Actions" tab (workflow_dispatch).
# macOS runners consume minutes at a higher rate than Linux ones, so this
# workflow is manual-only by default. Add push/pull_request triggers if you
# want it as part of CI.

on:
  workflow_dispatch:
  push:
    # Only this working branch: keeps macOS runner minutes under control
    # and keeps the main branch workflow untouched.
    branches: [remy/build-macos-dmg]

jobs:
  build-macos:
    name: Build macOS DMG (Qt)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install automake berkeley-db@5 boost ccache libevent librsvg \
            libtool miniupnpc pkg-config python qrencode qt@5 zeromq

      - name: Set up build environment
        run: |
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          {
            echo "BDB_PREFIX=$(brew --prefix berkeley-db@5)"
            echo "BOOST_ROOT=$(brew --prefix boost)"
            echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          } >> "$GITHUB_ENV"
          # Boost >= 1.89 no longer ships a libboost_system binary (Boost.System
          # is header-only now), but this autotools build still probes for it
          # ("Could not find a version of the Boost::System library!"). Drop an
          # empty static archive into the Boost lib dir so the configure probe
          # and the final link both succeed; nothing needs its symbols.
          # ar needs at least one member file to create the archive.
          echo "int boost_system_stub;" | c++ -x c++ -c -o /tmp/boost_system_stub.o -
          ar rcs "$(brew --prefix boost)/lib/libboost_system.a" /tmp/boost_system_stub.o
          ccache --max-size=2G
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.ref_name }}
          restore-keys: |
            ccache-macos-

      - name: Apply macOS toolchain compatibility patches
        run: |
          # Older Nusacoin sources use declaration style that modern Clang
          # rejects as a hard error ("'short type-name' is invalid"). Patch
          # the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/uint16_t short randv/uint16_t randv/' src/addrdb.cpp
          # Homebrew ships miniupnpc 2.2, whose UPNP_GetValidIGD takes 7
          # arguments (the old 5-argument call no longer compiles). Patch the
          # working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/UPNP_GetValidIGD(devlist, &urls, &data, lanaddr, sizeof(lanaddr));/UPNP_GetValidIGD(devlist, \&urls, \&data, lanaddr, sizeof(lanaddr), nullptr, 0);/' src/net.cpp
          # Boost >= 1.89 removed the old Filesystem v2 enum
          # fs::copy_option::overwrite_if_exists (singular). Use the v3 enum
          # class name instead: copy_options::overwrite_existing.
          # Patch the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/fs::copy_option::overwrite_if_exists/fs::copy_options::overwrite_existing/' src/wallet/bdb.cpp
          # Boost >= 1.80 removed the deprecated Filesystem v2 method
          # recursive_directory_iterator::level() (deprecated since 1.72);
          # use depth(), which has been the documented name since 1.72.
          # Patch the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/it.level()/it.depth()/' src/wallet/walletutil.cpp
          # Makefile.am still references contrib/macdeploy/fancy.plist as a
          # dmg prerequisite, but the file is missing from the repo (it
          # exists upstream; this fork lost it). Generate a minimal plist in
          # the working tree only; repo sources stay untouched. All keys are
          # optional for macdeployqtplus; background_picture is omitted on
          # purpose (the generated background.tiff does not live next to the
          # plist, so the script's path resolution would fail on it).
          cat > contrib/macdeploy/fancy.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>window_bounds</key>
          	<array>
          		<integer>100</integer>
          		<integer>100</integer>
          		<integer>540</integer>
          		<integer>380</integer>
          	</array>
          	<key>icon_size</key>
          	<integer>128</integer>
          	<key>applications_symlink</key>
          	<true/>
          	<key>items_position</key>
          	<dict>
          		<key>Nusacoin-Qt.app</key>
          		<array>
          			<integer>120</integer>
          			<integer>150</integer>
          		</array>
          		<key>Applications</key>
          		<array>
          			<integer>420</integer>
          			<integer>150</integer>
          		</array>
          	</dict>
          </dict>
          </plist>
          PLIST
          # macdeployqtplus calls plistlib.readPlist, removed in Python 3.9
          # (the script runs under python3). Use plistlib.load instead.
          # Patch the working-tree checkout only; repo sources stay untouched.
          sed -i '' 's/plistlib.readPlist(p)/plistlib.load(open(p, "rb"))/' contrib/macdeploy/macdeployqtplus

      - name: Configure
        run: |
          ./autogen.sh
          # CPPFLAGS/LDFLAGS point at Homebrew's include/lib so configure and
          # the compiler both find keg-only and versioned formulae (boost,
          # berkeley-db, libevent, ...) on Apple Silicon runners.
          # --with-boost=<prefix> is required: the BOOST_ROOT env var is only
          # honored by AX_BOOST_BASE for staged (unbuilt) Boost trees, so with
          # an installed Homebrew prefix BOOST_LDFLAGS stayed empty and the
          # ax_boost_* macros scanned the wrong directory for libboost_*
          # ("Could not find a version of the Boost::System library!").
          ./configure --with-incompatible-bdb --with-boost="$(brew --prefix boost)" \
            --disable-tests --disable-bench --disable-gui-tests \
            BDB_LIBS="-L${BDB_PREFIX}/lib -ldb_cxx-5.3" \
            BDB_CFLAGS="-I${BDB_PREFIX}/include" \
            CPPFLAGS="-I$(brew --prefix)/include" \
            LDFLAGS="-L$(brew --prefix)/lib" \
            CC="ccache clang" CXX="ccache clang++"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Create DMG
        run: |
          # Makefile.am's deploy rule passes -translations-dir=$(QT_TRANSLATION_DIR),
          # but configure never sets QT_TRANSLATION_DIR, so macdeployqtplus falls
          # back to <qt prefix>/translations — which does not exist in the
          # Homebrew qt@5 layout (translations ship under share/translations).
          # Ask Qt itself where they are and pass it via a make command-line
          # variable override (overrides are honored by the deploy rule).
          QT_TR_DIR="$(brew --prefix qt@5)/bin/qtpaths --query QT_INSTALL_TRANSLATIONS"
          test -d "$QT_TR_DIR"
          make deploy QT_TRANSLATION_DIR="$QT_TR_DIR"

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusacoin-qt-macos
          path: "*.dmg"
          if-no-files-found: error
